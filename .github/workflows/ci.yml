name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# 同一 PR / branch に新 push があれば古い run はキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # @ludiars scope (GitHub Packages) は組織内パッケージをビルトイン
      # GITHUB_TOKEN (packages:read) で取得する。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ludiars'

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check (lint)
        run: npm run lint

      - name: Test
        run: npm test

  web:
    name: web (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # vite.config.ts はドメイン情報を含むため gitignore 対象 (#21)。
      # CI は sanitized な example をコピーして build に使う (react plugin / proxy 定義のため)。
      - name: Provision vite config
        working-directory: web
        run: cp vite.config.example.ts vite.config.ts

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  tauri:
    name: tauri (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tauri-utils v2.9.2 + time v0.3.47 が Rust 1.85 coherence check で E0119 になる既知問題。
    # upstream 修正リリース後に削除する。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
