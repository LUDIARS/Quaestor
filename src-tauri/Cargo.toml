[package]
name = "quaestor"
version = "1.0.0"
edition = "2021"
description = "Quaestor — 個人会計の自動化 (LUDIARS)"

[lib]
name = "quaestor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quaestor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
